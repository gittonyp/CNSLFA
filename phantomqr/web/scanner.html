<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner — PhantomQR</title><link rel="stylesheet" href="/web/style.css">
<script src="/web/jsQR.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head>
<body><div class="wrap">
<div class="brand">PHANTOMQR SCANNER</div><h1>Professor scanner</h1>
<div class="nav"><a href="/">Home</a><a href="/staff/session">Sessions</a><a href="/dashboard">Security Center</a><a href="/attacks">Security Lab</a></div>
<div class="card"><div class="grid g3">
<div>Course<br><b id="c">–</b></div><div>Session<br><b id="s">–</b></div><div>Status<br><span class="pill live">● LIVE</span></div>
</div>
<label>Session ID</label><input id="sess" placeholder="S-XXXX">
<div id="reader" style="margin-top:10px"></div>
<button class="btn" id="cam" style="margin-top:8px">Start camera scan</button>
<label>Paste student token JSON (works without camera — for laptop demo)</label>
<textarea id="paste" rows="4" placeholder='{"sid":"21BT0451","did":"...","ctr":1,"ts":...,"nonce":"...","mac":"..."}'></textarea>
<button class="btn" id="go" style="margin-top:8px">Submit scan</button>
<label>Or upload QR image (decoded locally with jsQR)</label>
<input id="file" type="file" accept="image/*">
<div id="last" style="margin-top:10px"></div>
<div class="mono" id="net" style="margin-top:8px">Queued offline: 0 · Server: ● Connected</div>
</div></div>
<script>
const $=id=>document.getElementById(id);
// Offline queue: tokens the scanner couldn't upload. Each entry keeps the
// scanner-observed time, but server validity uses server time on arrival.
// NOTE: client-reported scanned_at is NOT trusted for validity (documented).
const Q=JSON.parse(localStorage.getItem('pq_queue')||'[]');
function saveQ(){localStorage.setItem('pq_queue',JSON.stringify(Q));paintQ();}
function paintQ(){$('net').textContent='Queued offline: '+Q.length+' · Server: '+(navigator.onLine?'● Connected':'○ Offline');}
paintQ();window.addEventListener('online',flush);window.addEventListener('offline',paintQ);
async function flush(){
  const staff=localStorage.getItem('pq_staff')||'';
  while(Q.length){
    const e=Q[0];
    try{
      const r=await fetch('/api/attendance/scan',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:e.token,session_id:e.session_id,staff_session_token:staff,scanned_at:e.scanned_at})});
      const j=await r.json();
      $('last').innerHTML=(j.success?'<span class="pill live">✓ ':'<span class="pill bad">✕ ')+j.status+'</span> '+(j.student||'')+'<div class="mono" style="margin-top:6px">'+j.message+' · '+j.latency_ms+'ms (from offline queue)</div>';
      Q.shift();saveQ();
    }catch(err){paintQ();break;}
  }
}
setInterval(flush,5000);
async function submit(tok){
  const staff=localStorage.getItem('pq_staff')||'';
  const sid=($('sess').value||localStorage.getItem('pq_session')||'').trim();
  if(!staff){$('last').innerHTML='<span class="bad">Staff login required at /staff/login.</span>';return;}
  if(!sid){$('last').innerHTML='<span class="bad">Enter session_id (open one at /staff/session).</span>';return;}
  let token=tok;if(typeof token==='string'){try{token=JSON.parse(token);}catch(e){$('last').innerHTML='<span class="bad">Not valid token JSON.</span>';return;}}
  const t0=performance.now();
  try{
    const r=await fetch('/api/attendance/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,session_id:sid,staff_session_token:staff,scanned_at:Math.floor(Date.now()/1000)})});
    const j=await r.json();
    const ms=Math.round(performance.now()-t0);
    $('last').innerHTML=(j.success?'<span class="pill live">✓ ':'<span class="pill bad">✕ ')+(j.student||'')+' — '+(j.message||'')+'</span><div class="mono" style="margin-top:6px">status='+j.status+' · latency='+ms+'ms(server '+j.latency_ms+'ms)</div>';
  }catch(e){
    Q.push({token,session_id:sid,scanned_at:Math.floor(Date.now()/1000),queued_at:Date.now()});saveQ();
    $('last').innerHTML='<span class="pill warn">OFFLINE — scan queued ('+Q.length+')</span>';
  }
}
$('go').onclick=()=>submit($('paste').value);
$('sess').value=localStorage.getItem('pq_session')||'';
$('sess').onchange=()=>localStorage.setItem('pq_session',$('sess').value.trim());
$('file').onchange=()=>{
  const f=$('file').files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
    const cx=cv.getContext('2d');cx.drawImage(img,0,0);
    const d=cx.getImageData(0,0,cv.width,cv.height);
    const code=jsQR(d.data,cv.width,cv.height);
    if(code){$('paste').value=code.data;submit(code.data);}
    else $('last').innerHTML='<span class="bad">No QR found in image.</span>';
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
};
// Camera via html5-qrcode if CDN loaded; paste/upload always available as fallback.
let scanning=false,hl=null;
$('cam').onclick=async()=>{
  if(typeof Html5Qrcode==='undefined'){$('last').innerHTML='<span class="bad">Camera lib unavailable offline — use paste/upload.</span>';return;}
  if(scanning){await hl.stop();scanning=false;$('cam').textContent='Start camera scan';return;}
  hl=new Html5Qrcode('reader');
  await hl.start({facingMode:'environment'},{fps:10,qrbox:250},(txt)=>{submit(txt);});
  scanning=true;$('cam').textContent='Stop camera';
};
(async()=>{ // show session info
  const sid=localStorage.getItem('pq_session')||'';
  if(!sid)return;
  const r=await fetch('/api/dashboard?session_id='+encodeURIComponent(sid));const j=await r.json();
  $('c').textContent=j.course||'–';$('s').textContent=sid;
})();
</script></div></body></html>

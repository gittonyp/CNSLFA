<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1976d2">
<title>Scanner — PhantomQR</title><link rel="stylesheet" href="/web/style.css">
<script src="/web/jsQR.js"></script>
<script src="/web/html5-qrcode.min.js"></script></head>
<body><div class="wrap">
<div class="brand">PHANTOMQR SCANNER</div>
<div class="scanhead">
<div><div class="dim">Course</div><b id="c">–</b></div>
<div><div class="dim">Session</div><b id="s">–</b></div>
<div><div class="dim">Scanned</div><b id="n">0</b></div>
</div>
<label>Session ID</label><input id="sess" placeholder="S-XXXX" autocomplete="off">
<div id="reader"></div>
<button class="btn big" id="cam">◎ Start scanner</button>
<div id="last" class="result" style="display:none"></div>
<div class="mono" id="net">Queued offline: 0 · Server: ● Connected</div>
<details><summary class="dim">No camera? Manual fallback (paste / upload)</summary>
<label>Paste student token JSON</label>
<textarea id="paste" rows="3" placeholder='{"sid":"21BT0451",...}'></textarea>
<button class="btn ghost" id="go">Submit pasted token</button>
<label>Or upload QR image (decoded on-device)</label>
<input id="file" type="file" accept="image/*">
</details>
<p class="dim">Camera needs localhost or HTTPS (browser rule). Over plain HTTP LAN IP, use the manual fallback above — same API, same verdicts.</p>
<div class="nav"><a href="/staff/session">Sessions</a><a href="/dashboard">Security Center</a></div>
</div>
<script>
const $=id=>document.getElementById(id);
// Offline queue (localStorage). server time decides validity on arrival;
// scanner-reported scanned_at is informational only.
const Q=JSON.parse(localStorage.getItem('pq_queue')||'[]');
let accepted=parseInt(localStorage.getItem('pq_accepted')||'0',10);
function saveQ(){localStorage.setItem('pq_queue',JSON.stringify(Q));paintQ();}
function paintQ(){
  $('net').textContent='Queued offline: '+Q.length+' · Server: '+(navigator.onLine?'● Connected':'○ Offline');
  $('n').textContent=accepted;
}
paintQ();window.addEventListener('online',flush);window.addEventListener('offline',paintQ);
async function flush(){
  const staff=localStorage.getItem('pq_staff')||'';
  if(!staff)return;
  while(Q.length){
    const e=Q[0];
    try{
      const r=await fetch('/api/attendance/scan',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:e.token,session_id:e.session_id,staff_session_token:staff,scanned_at:e.scanned_at})});
      show(await r.json(),true);
      Q.shift();saveQ();
    }catch(err){paintQ();break;}
  }
}
setInterval(flush,5000);
function show(j,queued){
  const el=$('last');el.style.display='block';
  el.className='result '+(j.success?'rok':'rbad');
  el.innerHTML='<b>'+(j.success?'✓ ':'✕ ')+(j.student||j.status)+'</b><br>'+(j.message||'')+
    '<div class="dim">'+j.status+' · '+(queued?'from offline queue':'live')+'</div>';
  if(j.success){
    accepted++;localStorage.setItem('pq_accepted',String(accepted));paintQ();
    if(navigator.vibrate)navigator.vibrate(60);
  }
  el.scrollIntoView({block:'nearest',behavior:'smooth'});
}
let lastPayload='',lastAt=0,cooling=false;
async function submit(tok){
  const staff=localStorage.getItem('pq_staff')||'';
  const sid=($('sess').value||localStorage.getItem('pq_session')||'').trim();
  if(!staff){show({success:false,status:'ERROR',message:'Staff login required — open /staff/login (ST04/demo123).'});return;}
  if(!sid){show({success:false,status:'ERROR',message:'Enter session_id first.'});return;}
  let token=tok;
  if(typeof token==='string'){try{token=JSON.parse(token);}catch(e){show({success:false,status:'ERROR',message:'Not valid token JSON.'});return;}}
  // Seamless mode: skip accidental double-reads of the same QR frame burst.
  const now=Date.now(),raw=typeof tok==='string'?tok:JSON.stringify(tok);
  if(raw===lastPayload&&now-lastAt<10000&&cooling)return;
  lastPayload=raw;lastAt=now;cooling=true;setTimeout(()=>cooling=false,2000);
  try{
    const r=await fetch('/api/attendance/scan',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,session_id:sid,staff_session_token:staff,scanned_at:Math.floor(now/1000)})});
    show(await r.json(),false);
  }catch(e){
    Q.push({token,session_id:sid,scanned_at:Math.floor(now/1000),queued_at:now});saveQ();
    const el=$('last');el.style.display='block';el.className='result rwarn';
    el.innerHTML='<b>○ Offline — scan queued ('+Q.length+')</b>';
  }
}
// ---- Continuous camera scan: point, beep-free, auto-submit on every decode ----
let scanning=false,hl=null;
$('cam').onclick=async()=>{
  if(typeof Html5Qrcode==='undefined'){$('cam').textContent='Camera lib failed to load — use manual fallback';return;}
  if(scanning){try{await hl.stop();}catch(e){}scanning=false;$('cam').textContent='◎ Start scanner';$('cam').classList.remove('stop');return;}
  try{
    hl=new Html5Qrcode('reader');
    await hl.start({facingMode:'environment'},{fps:10,qrbox:function(w,h){const s=Math.min(w,h)*0.75;return{width:s,height:s};}},(txt)=>submit(txt));
    scanning=true;$('cam').textContent='■ Stop scanner';$('cam').classList.add('stop');
  }catch(e){
    show({success:false,status:'ERROR',message:'Camera blocked: '+(e.message||e)+'. Use localhost/HTTPS or the manual fallback.'});
  }
};
$('go').onclick=()=>submit($('paste').value);
$('sess').value=localStorage.getItem('pq_session')||'';
$('sess').onchange=()=>localStorage.setItem('pq_session',$('sess').value.trim());
$('file').onchange=()=>{
  const f=$('file').files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
    const cx=cv.getContext('2d');cx.drawImage(img,0,0);
    const d=cx.getImageData(0,0,cv.width,cv.height);
    const code=jsQR(d.data,cv.width,cv.height);
    if(code){$('paste').value=code.data;submit(code.data);}
    else show({success:false,status:'ERROR',message:'No QR found in image.'});
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
};
(async()=>{
  const sid=localStorage.getItem('pq_session')||'';
  if(!sid)return;
  try{
    const r=await fetch('/api/dashboard?session_id='+encodeURIComponent(sid));const j=await r.json();
    $('c').textContent=j.course||'–';$('s').textContent=sid;
  }catch(e){}
})();
</script></div></body></html>
